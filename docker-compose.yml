services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_GOOGLE_GENERATION_CONFIG_API_KEY: ${NEXT_PUBLIC_GOOGLE_GENERATION_CONFIG_API_KEY}
        NEXT_PUBLIC_OPENWEATHER_API_KEY: ${NEXT_PUBLIC_OPENWEATHER_API_KEY}
        NEXT_PUBLIC_COUNTRYSTATECITY_API_KEY: ${NEXT_PUBLIC_COUNTRYSTATECITY_API_KEY}

    image: game-on

    ports:
      - "3000:3000"

    env_file:
      - .env