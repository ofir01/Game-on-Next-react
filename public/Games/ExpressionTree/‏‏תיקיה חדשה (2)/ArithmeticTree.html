<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Buttons</title>
   <link rel="stylesheet" href="ArithmeticTree.css">
</head>
<body>
    <div class="svg-container" >
        <svg id="head" data-node="true" width="100" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- עיגול עם מספר בתוכו -->
            <circle cx="50" cy="50" r="30" stroke="#228B22" stroke-width="3" fill="lightblue" />
            <!-- טקסט בתוך העיגול -->
            <text x="50" y="55" font-size="20" text-anchor="middle" fill="black">5</text>
        </svg>
    </div>
    

    
   
    <div id="sidebar" class="sidebar">
        <div class="svg-wrapper">
            <div class="counter counterL">15</div>
            <svg class="mySvg" id="svg1" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet">
                <!-- ענף -->
                <line x1="300" y1="100" x2="190" y2="195" stroke="#8B4513" stroke-width="10" />
                <!-- עיגול בקצה -->
                <circle cx="160" cy="230" r="60" fill="#FFFFFF" stroke="#8B4513" stroke-width="10" />
                <!-- טקסט בתוך העיגול -->
                <text x="160" y="235" font-family="Arial" font-size="56" text-anchor="middle" dominant-baseline="middle" fill="#8B4513">
                    5
                </text>
            </svg>
        </div>
        
        
        <div class="svg-wrapper">
            <div class="counter counterR">10</div>
            <svg class="mySvg" id="svg2" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet">
                <!-- ענף -->
                <line x1="60" y1="100" x2="190" y2="195" stroke="#8B4513" stroke-width="10" />
                <!-- עיגול בקצה -->
                <circle cx="240" cy="230" r="60" fill="#FFFFFF" stroke="#8B4513" stroke-width="10" />
                <!-- טקסט בתוך העיגול -->
                <text x="240" y="235" font-family="Arial" font-size="56" text-anchor="middle" dominant-baseline="middle" fill="#8B4513">
                    5
                </text>
            </svg>
        </div>
        
        
    </div>

    <button id="openSidebarBtn" onclick="toggleSidebar()">☰</button>


    <div id="cloneArea" style="display: none; position: relative; width: 400px; height: 400px; border: 1px solid black;">
        <!-- כאן יווצרו ההעתקים -->
      </div>

    <script src="ArithmeticTree.js"></script>
</body>
</html>
