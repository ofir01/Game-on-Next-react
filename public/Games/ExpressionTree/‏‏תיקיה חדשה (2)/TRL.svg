<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Background -->
  <rect width="400" height="400" fill="#FFFFFF"/>

  <!-- Right Branch -->
  <line x1="200" y1="100" x2="300" y2="200" stroke="#8B4513" stroke-width="6" />
  <circle cx="300" cy="200" r="20" fill="#FFFFFF" stroke="#8B4513" stroke-width="3" />
  <text x="300" y="206" font-family="Arial" font-size="16" text-anchor="middle" fill="#8B4513">
    5
  </text>

  <!-- Left Branch -->
  <line x1="200" y1="100" x2="100" y2="200" stroke="#8B4513" stroke-width="6" />
  <circle cx="100" cy="200" r="20" fill="#FFFFFF" stroke="#8B4513" stroke-width="3" />
  <text x="100" y="206" font-family="Arial" font-size="16" text-anchor="middle" fill="#8B4513">
    3
  </text>
</svg>
