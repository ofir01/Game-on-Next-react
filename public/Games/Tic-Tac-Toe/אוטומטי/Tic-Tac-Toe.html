<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>איקס עיגול מתקדם</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .player-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 20px;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            justify-content: center;
            margin-top: 20px;
        }
        .cell {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            border: 2px solid black;
            cursor: pointer;
            position: relative;
        }
        .cell.x {
            color: red;
        }
        .cell.o {
            color: blue;
        }
        .cell.winner {
            background-color: yellow;
        }
        #status {
            margin-top: 20px;
            font-size: 1.5em;
        }
        #status.x-turn {
            color: red;
        }
        #status.o-turn {
            color: blue;
        }
        #status.draw {
            color: gray;
        }
        #score {
            margin-top: 20px;
            font-size: 1.5em;
        }
    </style>
</head>
<body>
    <h1>איקס עיגול מתקדם</h1>
    <div id="status">טוען...</div>
    <div id="score">X: 0 | O: 0 | תיקו: 0</div>
    <div class="board" id="board"></div>
    <button onclick="resetGame()">אתחל משחק</button>
    
    <script>
        let currentPlayer = Math.random() < 0.5 ? 'X' : 'O';
        let board = new Array(9).fill(null);
        let scores = { 'X': 0, 'O': 0, 'draws': 0 };
        const boardElement = document.getElementById("board");
        const statusElement = document.getElementById("status");
        const scoreElement = document.getElementById("score");
        let gameActive = true;

        function createBoard() {
            boardElement.innerHTML = '';
            board.forEach((cell, index) => {
                const cellElement = document.createElement("div");
                cellElement.classList.add("cell");
                cellElement.dataset.index = index;
                if (cell) {
                    cellElement.textContent = cell;
                    cellElement.classList.add(cell.toLowerCase());
                }
                cellElement.addEventListener("click", handleMove);
                boardElement.appendChild(cellElement);
            });
        }

        function updateStatus() {
            statusElement.textContent = `תור של ${currentPlayer}`;
            statusElement.className = currentPlayer === 'X' ? 'x-turn' : 'o-turn';
        }

        function handleMove(event) {
            if (!gameActive) return;
            const index = event.target.dataset.index;
            if (!board[index]) {
                board[index] = currentPlayer;
                createBoard();
                const winnerCells = checkWinner();
                console.log(winnerCells);

                if (winnerCells.length > 0) {
                    statusElement.textContent = `! ${currentPlayer}  ניצח השחקן`;
                    statusElement.className = currentPlayer === 'X' ? 'x-turn' : 'o-turn';
                    scores[currentPlayer]++;
                    updateScore();
                    highlightWinner(winnerCells);
                    gameActive = false;
                    return;
                }
                //לבדיקת תיקו - בודקים שכל התאים מלאים
                if (board.every(cell => cell)) {
                    statusElement.textContent = "תיקו!";
                    statusElement.className = "draw";
                    scores.draws++;
                    updateScore();
                    gameActive = false;
                    return;
                }
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                updateStatus();
            }
        }

        function checkWinner() {
            const winningCombinations = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6]
            ];
            let winningCells = [];
            winningCombinations.forEach(combination => {
                const [a, b, c] = combination;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    winningCells = [...winningCells, ...combination];
                }
            });
            return [...new Set(winningCells)];
        }

        function highlightWinner(cells) {
            cells.forEach(index => {
                document.querySelector(`[data-index='${index}']`).classList.add("winner");
            });
        }

        function updateScore() {
            scoreElement.textContent = `X: ${scores['X']} | O: ${scores['O']} | תיקו: ${scores['draws']}`;
        }

        function resetGame() {
            board = new Array(9).fill(null);
            currentPlayer = Math.random() < 0.5 ? 'X' : 'O';
            gameActive = true;
            updateStatus();
            createBoard();
        }

        updateStatus();
        createBoard();
    </script>
</body>
</html>
