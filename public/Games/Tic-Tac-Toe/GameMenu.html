<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="Tic-Tac-Toe.css">
</head>
<body>
    <h1>איקס עיגול מתקדם</h1>
    <div id="status">טוען...</div>
    <div id="score">X: 0 | O: 0 | תיקו: 0</div>
    
    <div class="container">
        <div class="player-panel" id="playerX-panel"></div>
        <div class="board" id="board"></div>
        <div class="player-panel" id="playerO-panel"></div>
    </div>
    
    
    
    <button onclick="resetGame()">אתחל משחק</button>
    
    <script src="../game-session-events.js"></script>
    <script src="Tic-Tac-Toe.js"></script>
</body>
</html>
