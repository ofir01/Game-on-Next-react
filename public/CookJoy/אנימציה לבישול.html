<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>גלריית אנימציה פרימיום</title>
    <!-- טעינת Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* הגדרת גופנים */
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap');
        
        body {
            font-family: 'Heebo', sans-serif;
            /* רקע גרדיאנט מונפש */
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #1f2937;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- אפקט זכוכית (Glassmorphism) --- */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            /* צללית חזקה יותר לפאנל הראשי */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
        }

        /* --- אנימציות כניסה ויציאה של הפריט הראשי --- */
        @keyframes slide-out-left {
            0% { opacity: 1; transform: translateX(0) scale(1); }
            100% { opacity: 0; transform: translateX(-120%) scale(0.95); }
        }
        
        @keyframes drop-in-rotate {
            0% { opacity: 0; transform: translateY(-100vh) rotateZ(-45deg) scale(0.5); }
            70% { opacity: 1; transform: translateY(20px) rotateZ(5deg) scale(1.05); } 
            100% { opacity: 1; transform: translateY(0) rotateZ(0deg) scale(1); }
        }

        #animated-wrapper { will-change: transform, opacity; position: relative; }
        .animate-in { animation: drop-in-rotate 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .animate-out { animation: slide-out-left 0.6s cubic-bezier(0.55, 0.085, 0.68, 0.53) forwards; }

        /* טקסט ראשי עם צללית צבעונית */
        .main-display-text {
            font-size: 6rem;
            font-weight: 900;
            line-height: 1;
            filter: drop-shadow(0 10px 15px var(--current-shadow-color));
            transition: color 0.5s ease;
        }

        /* --- שיפור: אפקט הטיה 3D לתיבה הראשית בריחוף --- */
        #main-content-box {
            transition: all 0.4s ease-out;
            transform-style: preserve-3d; /* מכין את האלמנט לעבודה ב-3D */
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); /* צללית התחלתית */
        }
        
        /* הטיה קלה וצל מוגדל כשמרחפים על האלמנט העוטף */
        .group:hover #main-content-box {
            transform: perspective(1000px) rotateX(1deg) rotateY(-1deg);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
        }

        /* --- שיפור: כרטיסיות תגובה (Hover) --- */
        .thumbnail-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            min-width: 250px; 
            margin-left: 1.5rem; /* מרווח בין האלמנטים, חיוני לגלילה ב-RTL */
            cursor: pointer;
            user-select: none;
            flex-shrink: 0; 
        }

        /* מצב פעיל - עם צללית צבעונית חזקה יותר */
        .thumbnail-card.active {
            transform: translateY(-5px) scale(1.02) rotateZ(-0.5deg); 
            border-color: var(--current-color);
            box-shadow: 0 10px 20px var(--current-shadow-color), 0 0 0 4px var(--current-color);
        }
        
        /* מצב ריחוף - מכין אותו להיות פעיל */
        .thumbnail-card:not(.active):hover {
            transform: translateY(-8px) scale(1.04) rotateZ(0.5deg);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }

        /* --- סגנונות קרוסלת גלילה אינסופית ואפקט דהייה --- */

        #slider-container {
            width: 100%;
            overflow: hidden; 
            padding-top: 1rem;
            padding-bottom: 1rem;
            position: relative; 
            transition: transform 0.3s ease-in-out; 
        }

        #slider-track {
            display: flex; 
            will-change: transform;
        }

        /* שכבות הדהייה */
        .fading-edge {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            width: 80px; 
            pointer-events: none; 
            z-index: 10;
        }

        .fading-edge.right-edge {
            right: 0;
            background: linear-gradient(to left, rgba(255, 255, 255, 0.85) 50%, transparent);
        }

        .fading-edge.left-edge {
            left: 0;
            background: linear-gradient(to right, rgba(255, 255, 255, 0.85) 50%, transparent);
        }
        
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col justify-center items-center overflow-hidden">

    <!-- המיכל הראשי - אפקט זכוכית -->
    <div class="glass-panel max-w-5xl w-full shadow-2xl rounded-3xl p-8 md:p-12 overflow-hidden relative">
        
        <!-- קישוט רקע עדין -->
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-transparent via-gray-200 to-transparent opacity-50"></div>

        <!-- איזור התצוגה הראשית (מעלה) -->
        <div id="main-display" class="mb-12 border-b border-gray-200/60 pb-10">
            
            <!-- ****** האלמנט העוטף שכולו יסתובב - הוספנו קלאס group עבור ה-hover effect ****** -->
            <div id="animated-wrapper" class="flex flex-col md:flex-row gap-10 items-center group">
                
                <!-- 1. איזור טקסט (שמאל) -->
                <div class="md:w-5/12 flex flex-col justify-center items-start space-y-4">
                    <span id="main-badge" class="px-3 py-1 rounded-full text-sm font-bold bg-gray-100 text-gray-500 tracking-wide uppercase transition-colors duration-500">
                        קטגוריה
                    </span>
                    <h1 id="main-title" class="text-4xl md:text-6xl font-black text-gray-800 leading-tight tracking-tight transition-colors duration-500">
                        ...
                    </h1>
                    <div class="h-1 w-20 rounded-full bg-gray-300 transition-colors duration-500" id="title-underline"></div>
                    <p id="main-subtitle" class="text-lg md:text-xl text-gray-600 font-light leading-relaxed">
                        ...
                    </p>
                </div>

                <!-- 2. איזור התמונה המוגדלת (ימין) -->
                <div id="main-content-box" class="md:w-7/12 w-full flex justify-center items-center p-8 bg-white/50 backdrop-blur-sm rounded-[3rem] border border-white/60 relative overflow-hidden">
                    
                    <!-- רקע דקורטיבי עדין בתוך הבועה -->
                    <div class="absolute inset-0 bg-gradient-to-br from-white/80 to-transparent opacity-50"></div>
                    
                    <!-- הטקסט/אייקון הראשי -->
                    <div id="main-content" class="relative z-10 text-center transition duration-500">
                        לחץ למטה
                    </div>
                </div>
            </div>
        </div>

        <!-- איזור הקרוסלה - עם שכבות הדהייה החדשות -->
        <div id="slider-container" class="mt-6">
            <!-- שכבת דהייה שמאלית -->
            <div class="fading-edge left-edge"></div>
            <!-- שכבת דהייה ימנית -->
            <div class="fading-edge right-edge"></div>
            
            <div id="slider-track" style="transform: translateX(0px);">
                <!-- הכרטיסיות נוצרות כאן ב-JS (ומשוכפלות) -->
            </div>
        </div>

    </div>

    <script>
        // הגדרת הנתונים עם צבעים ייחודיים לכל פריט
        const items = [
            { 
                id: 1, 
                title: "כוכב הצפון", 
                subtitle: "הכוכב הבהיר ביותר בקבוצת הכוכבים הדובה הקטנה. מסמל כיוון, יציבות והשראה.", 
                content: "★", 
                category: "אסטרונומיה",
                color: "#f59e0b", 
                shadowColor: "rgba(245, 158, 11, 0.7)" 
            },
            { 
                id: 2, 
                title: "שמש קיצית", 
                subtitle: "מקור האנרגיה של מערכת השמש שלנו. מסמלת חום, חיים, כוח ואופטימיות נצחית.", 
                content: "☀", 
                category: "טבע",
                color: "#ef4444", 
                shadowColor: "rgba(239, 68, 68, 0.7)"
            },
            { 
                id: 3, 
                title: "חלון לעתיד", 
                subtitle: "מבט אל האופק הדיגיטלי החדש. מסמל טכנולוגיה, חדשנות ופרספקטיבה חדשה.", 
                content: "◫", 
                category: "טכנולוגיה",
                color: "#3b82f6", 
                shadowColor: "rgba(59, 130, 246, 0.7)"
            },
            { 
                id: 4, 
                title: "לב אנרגטי", 
                subtitle: "סמל לאנרגיה פועמת וחיים. מחבר בין רגש ורציונל.", 
                content: "♥", 
                category: "רגש",
                color: "#db2777", 
                shadowColor: "rgba(219, 39, 119, 0.7)"
            },
            { 
                id: 5, 
                title: "ינשוף חכם", 
                subtitle: "ציפור הלילה המסמלת חוכמה, ידע וראיית הנולד.", 
                content: "🦉", 
                category: "חיות",
                color: "#10b981", 
                shadowColor: "rgba(16, 185, 129, 0.7)"
            }
        ];

        // אלמנטים
        const sliderTrack = document.getElementById('slider-track');
        const mainContent = document.getElementById('main-content');
        const mainTitle = document.getElementById('main-title');
        const mainSubtitle = document.getElementById('main-subtitle');
        const mainBadge = document.getElementById('main-badge');
        const titleUnderline = document.getElementById('title-underline');
        const animatedWrapper = document.getElementById('animated-wrapper');
        const sliderContainer = document.getElementById('slider-container');
        
        let currentActiveThumbnail = null;
        let isFirstLoad = true;
        
        // הגדרות אנימציה של הפריט הראשי
        const EXIT_DURATION_MS = 600; 
        const ENTER_DURATION_MS = 1200;

        // הגדרות קרוסלת גלילה אינסופית
        let currentPosition = 0; 
        const SCROLL_SPEED = 1.0; // מהירות הגלילה (פיקסלים לפריימים)
        const INTERVAL_MS = 20; // מרווח זמן (50 פריימים בשנייה)
        let widthOfOriginalTrack = 0; // רוחב המסלול המקורי (לצורך איפוס)
        let scrollInterval = null; 

        // --- לוגיקת האנימציה הראשית של האלמנט הגדול ---
        
        // החלת צבעים דינמיים
        function applyThemeColors(item) {
            document.documentElement.style.setProperty('--current-shadow-color', item.shadowColor);
            document.documentElement.style.setProperty('--current-color', item.color);
            mainContent.style.color = item.color;
            mainBadge.style.color = item.color;
            mainBadge.style.backgroundColor = item.color + '15'; 
            titleUnderline.style.backgroundColor = item.color;
        }

        function startEntranceAnimation(item) {
            mainTitle.textContent = item.title;
            mainSubtitle.textContent = item.subtitle;
            mainContent.textContent = item.content;
            mainBadge.textContent = item.category;
            
            applyThemeColors(item);
            
            animatedWrapper.classList.remove('animate-out');
            animatedWrapper.classList.remove('animate-in'); 
            mainContent.classList.add('main-display-text');

            setTimeout(() => {
                animatedWrapper.classList.add('animate-in');
            }, 50); 
        }
        
        function updateMainDisplay(item, thumbnailElement) {
            // ניהול ה-Active State של הכרטיסיות
            if (currentActiveThumbnail) {
                // נסיר את ה-active מכל מה שהיה פעיל קודם
                currentActiveThumbnail.classList.remove('active');
            }
            
            currentActiveThumbnail = thumbnailElement;
            currentActiveThumbnail.classList.add('active');


            // לוגיקת החלפה
            if (isFirstLoad) {
                isFirstLoad = false;
                startEntranceAnimation(item);
                return;
            }
            
            // אנחנו מעדכנים את התצוגה רק אם הפריט שנלחץ הוא אחד מהפריטים המקוריים
            // (כלומר, הוא לא כפיל שנוצר רק לצורך הגלילה)
            // מכיוון שאנחנו מעתיקים את ה-event listeners, נשתמש ב-itemData
            const isOriginalItem = items.some(originalItem => originalItem.id === item.id);

            if (isOriginalItem) {
                // אנימציית יציאה
                animatedWrapper.classList.remove('animate-in');
                animatedWrapper.classList.add('animate-out');

                // המתנה וטעינה
                setTimeout(() => {
                    startEntranceAnimation(item);
                    
                    // ניקוי קלאס בסוף
                    setTimeout(() => {
                        animatedWrapper.classList.remove('animate-in');
                    }, ENTER_DURATION_MS + 50); 

                }, EXIT_DURATION_MS + 50); 
            }
        }
        
        // --- לוגיקת גלילה אינסופית חלקה (שכפול) והשהיה בריחוף ---

        function pauseScroll() {
            if (scrollInterval) {
                clearInterval(scrollInterval);
                scrollInterval = null;
            }
        }

        function resumeScroll() {
            if (!scrollInterval && widthOfOriginalTrack > 0) {
                scrollInterval = setInterval(() => {
                    // 1. הזזת המיקום שמאלה
                    currentPosition -= SCROLL_SPEED;
                    sliderTrack.style.transform = `translateX(${currentPosition}px)`;

                    // 2. בדיקה: האם עברנו את כל רוחב הרשימה המקורית?
                    if (currentPosition <= -widthOfOriginalTrack) {
                        
                        // 3. איפוס מיידי של הטרנספורמציה חזרה להתחלה (בלתי נראה)
                        currentPosition += widthOfOriginalTrack;
                        sliderTrack.style.transform = `translateX(${currentPosition}px)`;
                    }
                }, INTERVAL_MS); 
            }
        }
        
        function createThumbnails() {
            const originalElements = [];

            // 1. יצירת הכרטיסיות המקוריות
            items.forEach((item, index) => {
                const div = document.createElement('div');
                div.id = `thumbnail-${item.id}`;
                div.className = `
                    thumbnail-card
                    p-6 bg-white/60 backdrop-blur-sm
                    rounded-2xl border-2 border-transparent
                    flex flex-col items-center justify-center
                    group
                `;
                
                div.innerHTML = `
                    <span class="text-4xl mb-3 transition-transform duration-300 group-hover:scale-110" style="color: ${item.color}; text-shadow: 0 4px 8px ${item.shadowColor}">${item.content}</span>
                    <span class="text-sm font-bold text-gray-600 group-hover:text-gray-900">${item.title}</span>
                `;
                
                div.itemData = item;

                div.addEventListener('click', () => {
                    // מעביר את האלמנט שנלחץ כדי שיסומן כפעיל
                    updateMainDisplay(item, div);
                });

                sliderTrack.appendChild(div);
                originalElements.push(div);
                
                // טעינת הפריט הראשון
                if (index === 0) {
                    setTimeout(() => updateMainDisplay(item, div), 100);
                }
            });

            // *** חישוב הרוחב הכולל של המסלול המקורי (התיקון הקריטי) ***
            if (originalElements.length > 0) {
                 // 1. מדידת רוחב הגלילה הכללי של התוכן המקורי (W + כל המרווחים)
                 widthOfOriginalTrack = sliderTrack.scrollWidth;
                 
                 // 2. הסרת המרווח העודף: בגלל dir="rtl", ה-margin-left של האלמנט ה*שמאלי ביותר*
                 // הוא מרווח גרירה שיוצא מחוץ למסך ואינו חלק מהרוחב שאותו צריך לגלול 
                 // כדי להתחיל את העותק הראשון.
                 const lastElementIndex = originalElements.length - 1;
                 const trailingMarginLeft = parseFloat(window.getComputedStyle(originalElements[lastElementIndex]).marginLeft);
                 
                 // הפחתת המרווח המיותר כדי לקבל את הרוחב המדויק לגלילה של סבב אחד
                 widthOfOriginalTrack -= trailingMarginLeft; 
            }
            
            // *** שכפול התוכן (בנייה מחדש) ***
            originalElements.forEach(originalNode => {
                // יצירת עותק מושלם כולל ילדים
                const clone = originalNode.cloneNode(true); 
                clone.removeAttribute('id'); 
                
                // העתקת הנתונים
                clone.itemData = originalNode.itemData;
                
                // הוספת Listener: כאשר לוחצים על עותק, הוא יסמן את עצמו כפעיל (visually)
                // ויעדכן את התצוגה הראשית עם הנתונים של הפריט המקורי.
                clone.addEventListener('click', () => {
                    updateMainDisplay(clone.itemData, clone); 
                });
                
                sliderTrack.appendChild(clone);
            });

            // הפעלת לולאת הגלילה האינסופית
            resumeScroll();

            // הוספת פונקציונליות השהיה/חידוש בריחוף
            sliderContainer.addEventListener('mouseenter', pauseScroll);
            sliderContainer.addEventListener('mouseleave', resumeScroll);
        }

        window.onload = createThumbnails;

    </script>
</body>
</html>
